# YOLOv11s + P2 head + 完整 BiFPN (2 层堆叠, P2 通道 128, 其他 192)
# 注意: Conv 的 yaml 通道写 2x, 经 width=0.5 缩放后达到预期值; BiFPN c_out 不缩放保持原值
nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2  (实际 32)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4  (实际 64)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4  (实际 128)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8  (实际 128)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8  (实际 256)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (实际 256)
  - [-1, 2, C3k2, [512, True]] # 6-P4/16 (实际 256)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (实际 512)
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32 (实际 512)
  - [-1, 1, SPPF, [1024, 5]] # 9       (实际 512)
  - [-1, 2, C2PSA, [1024]] # 10      (实际 512)

head:
  # ===== 前置投影 (yaml 写 2x, 缩放后达预期) =====
  - [10, 1, Conv, [384, 1, 1]] # 11 P5_proj (实际 1024→192, 但 backbone 末端实际 512→192)
  - [6, 1, Conv, [384, 1, 1]] # 12 P4_proj (实际 256→192)
  - [4, 1, Conv, [384, 1, 1]] # 13 P3_proj (实际 256→192)
  - [2, 1, Conv, [256, 1, 1]] # 14 P2_proj (实际 128→128)

  # ===== BiFPN Layer 1 Top-Down (BiFPN c_out 不缩放, 保持 yaml 写的值) =====
  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 15 P5_up→P4 尺度
  - [[-1, 12], 1, BiFPN_2way, [192]] # 16 P4_td1 (c_in1=192, c_in2=192, c_out=192)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 P4_td1_up→P3 尺度
  - [[-1, 13], 1, BiFPN_2way, [192]] # 18 P3_td1
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19 P3_td1_up→P2 尺度
  - [[-1, 14], 1, BiFPN_2way, [128]] # 20 P2_td1 (c_in1=192, c_in2=128, c_out=128)

  # ===== BiFPN Layer 1 Bottom-Up (yaml 写 384, 实际 192) =====
  - [-1, 1, Conv, [384, 3, 2]] # 21 P2_td1_down (实际 128→192)
  - [[-1, 18, 13], 1, BiFPN_3way, [192]] # 22 P3_bu1 (c_in1=192, c_in2=192, c_in3=192, c_out=192)
  - [-1, 1, Conv, [384, 3, 2]] # 23 P3_bu1_down (实际 192→192)
  - [[-1, 16, 12], 1, BiFPN_3way, [192]] # 24 P4_bu1
  - [-1, 1, Conv, [384, 3, 2]] # 25 P4_bu1_down
  - [[-1, 11], 1, BiFPN_2way, [192]] # 26 P5_bu1

  # ===== BiFPN Layer 2 Top-Down =====
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 27 P5_bu1_up→P4
  - [[-1, 24, 16], 1, BiFPN_3way, [192]] # 28 P4_td2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 29 P4_td2_up→P3
  - [[-1, 22, 18], 1, BiFPN_3way, [192]] # 30 P3_td2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 31 P3_td2_up→P2
  - [[-1, 20], 1, BiFPN_2way, [128]] # 32 P2_td2 (c_in1=192, c_in2=128, c_out=128)

  # ===== BiFPN Layer 2 Bottom-Up =====
  - [-1, 1, Conv, [384, 3, 2]] # 33 P2_td2_down (实际 128→192)
  - [[-1, 30, 22], 1, BiFPN_3way, [192]] # 34 P3_bu2
  - [-1, 1, Conv, [384, 3, 2]] # 35 P3_bu2_down
  - [[-1, 28, 24], 1, BiFPN_3way, [192]] # 36 P4_bu2
  - [-1, 1, Conv, [384, 3, 2]] # 37 P4_bu2_down
  - [[-1, 26], 1, BiFPN_2way, [192]] # 38 P5_bu2

  # ===== 输出投影 (对齐 baseline yolo11s 的 P2/P3/P4/P5 通道: 128/256/512/512) =====
  - [32, 1, Conv, [256, 1, 1]] # 39 P2_out (实际 128→128)
  - [34, 1, Conv, [512, 1, 1]] # 40 P3_out (实际 192→256)
  - [36, 1, Conv, [1024, 1, 1]] # 41 P4_out (实际 192→512)
  - [38, 1, Conv, [1024, 1, 1]] # 42 P5_out (实际 192→512)

  - [[39, 40, 41, 42], 1, Detect, [nc]] # 43 Detect(P2, P3, P4, P5)
