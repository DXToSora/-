# YOLOv11s + P2 高分辨率检测头 + SEFuse 注意力融合（Concat 的严格超集）
nc: 10  # VisDrone 10 类
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2-P2/4  ← P2 源
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4-P3/8  ← P3 源
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]           # 6-P4/16 ← P4 源
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]             # 9-P5/32
  - [-1, 2, C2PSA, [1024]]               # 10-P5/32 ← P5 源

head:
  # 顶部 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11-P4/16
  - [[-1, 6], 1, SEFuse, []]                     # 12 注意力融合 P4
  - [-1, 2, C3k2, [512, False]]                  # 13-P4/16

  # → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14-P3/8
  - [[-1, 4], 1, SEFuse, []]                     # 15 注意力融合 P3
  - [-1, 2, C3k2, [256, False]]                  # 16-P3/8

  # ↓ 新增 P2 分支
  - [-1, 1, Conv, [128, 1, 1]]                    # 17 通道压缩 (P3/8)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18-P2/4
  - [[-1, 2], 1, SEFuse, []]                     # 19 注意力融合 P2
  - [-1, 2, C3k2, [128, False, 0.25]]             # 20-P2/4

  # 下采样回传
  - [-1, 1, Conv, [256, 3, 2]]                    # 21-P3/8
  - [[-1, 16], 1, SEFuse, []]                    # 22 注意力融合 P3
  - [-1, 2, C3k2, [256, False]]                   # 23-P3/8

  - [-1, 1, Conv, [512, 3, 2]]                    # 24-P4/16
  - [[-1, 13], 1, SEFuse, []]                    # 25 注意力融合 P4
  - [-1, 2, C3k2, [512, False]]                  # 26-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]                   # 27-P5/32
  - [[-1, 10], 1, SEFuse, []]                    # 28 注意力融合 P5
  - [-1, 2, C3k2, [1024, True]]                   # 29-P5/32

  - [[20, 23, 26, 29], 1, Detect, [nc]]           # 30-Detect(P2, P3, P4, P5)
