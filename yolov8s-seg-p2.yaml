# 基于 yolov8s-seg 增加 P2 小目标检测层（4 个检测头：P2/4, P3/8, P4/16, P5/32）
nc: 4
depth_multiple: 0.33 # 对应 yolov8s 的深度缩放
width_multiple: 0.5 # 对应 yolov8s 的宽度缩放

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat P4
  - [-1, 3, C2f, [512]] # 12 (P4/16)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat P3
  - [-1, 3, C2f, [256]] # 15 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 新增
  - [[-1, 2], 1, Concat, [1]] # 17 cat P2 新增
  - [-1, 3, C2f, [128]] # 18 (P2/4 小目标检测层) 新增

  - [-1, 1, Conv, [128, 3, 2]] # 19 新增
  - [[-1, 15], 1, Concat, [1]] # 20 cat P3 新增
  - [-1, 3, C2f, [256]] # 21 (P3/8 检测层)

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat P4
  - [-1, 3, C2f, [512]] # 24 (P4/16 检测层)

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]] # 26 cat P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32 检测层)

  - [[18, 21, 24, 27], 1, Segment, [nc, 32, 256]] # 28 Segment(P2,P3,P4,P5)
